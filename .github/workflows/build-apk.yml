name: Build Android APK (COTA ERP)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código-fonte do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuração do ambiente Node.js 20 com cache do NPM
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Instalação de dependências do projeto
      - name: Install Dependencies
        run: npm ci

      # 4. Build de produção do Frontend Web (Vite gera a pasta dist/)
      - name: Build Web Application
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      # 5. Sincronização dos assets do webDir (dist/) com o projeto nativo Android
      - name: Capacitor Sync
        run: npx cap sync android

      # 6. Configuração do Java JDK 21 (Temurin) para compilação do Gradle
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 7. Garantir permissão de execução ao script do Gradle Wrapper
      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      # 8. Compilação do APK de Debug do Android
      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      # 9. Upload do APK gerado como Artefato do GitHub Actions
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: COTA-ERP-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

# ==============================================================================
